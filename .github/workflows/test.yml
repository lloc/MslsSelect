name: UnitTests and CodeCoverage
on: [push]
jobs:
  qa:
    name: Coding standards and static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Composer dependencies
        run: composer install --no-interaction
      - name: Run PHPCS
        run: composer run-script phpcs
      # Analyses MslsSelect against the real Multisite Language Switcher, which composer
      # installs into vendor/. Never point this at the test doubles - stubs hide renames
      # in the MSLS API instead of catching them.
      - name: Run PHPStan
        run: composer run-script phpstan
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    name: PHPUnit on PHP ${{ matrix.php }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # MSLS is a dev dependency for PHPStan only - the unit tests use Brain Monkey and
      # never touch an MSLS class. Dropping it here lets the matrix cover the PHP 7.4 floor
      # the plugin declares, independent of MSLS's own dependency choices: MSLS 3.0.0-3.0.2
      # pull php-di ^7, which requires PHP 8.0. (MSLS 3.0.3 returns to php-di ^6.4.)
      - name: Composer dependencies
        run: |
          composer remove --dev --no-update --no-interaction lloc/multisite-language-switcher
          composer update --no-interaction
      - name: Run Testsuite
        run: vendor/bin/phpunit
  code-coverages:
    runs-on: ubuntu-latest
    needs: [qa, unit-tests]
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Composer dependencies
        run: composer install --no-interaction
      - name: Run Testsuite
        run: php -d xdebug.mode=coverage vendor/bin/phpunit --coverage-clover=coverage.xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.xml
